# Kustomization rendered by deploy.sh via envsubst.
# configMapGenerator hashes the deck content into the ConfigMap name;
# kustomize automatically rewrites the Deployment's volume reference to
# the hashed name, so every deck change triggers a rolling update.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
resources:
  - deployment.yaml
configMapGenerator:
  - name: ${CONFIGMAP_NAME}
    files:
      - index.html=index.html
